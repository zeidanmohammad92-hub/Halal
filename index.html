<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">
<title>Helel Smith | Creative Director</title>
<style>
  :root {
    --ink: #08090b;
    --paper: #ffffff;
    --muted: #69707a;
    --line: #e5e7eb;
    --red: #b51f2a;
    --yellow: #ffd900;
    --blue: #1ba4d5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 12px;
    display: flex; align-items: center; justify-content: center;
    background: #eef0f3; color: #111318;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: min(100%, 680px); background: var(--paper);
    border-radius: 26px; padding: 28px 42px 26px;
    box-shadow: 0 18px 55px rgba(0,0,0,.14);
    text-align: center; overflow: hidden; position: relative;
  }
  .top-accent { height: 7px; position: absolute; inset: 0 0 auto; display: flex; }
  .top-accent span { flex: 1; }
  .top-accent span:nth-child(1) { background: var(--red); }
  .top-accent span:nth-child(2) { background: var(--yellow); }
  .top-accent span:nth-child(3) { background: #fff; }
  .top-accent span:nth-child(4) { background: var(--blue); }
  .logo-wrap {
    background: #050505; border-radius: 16px; padding: 9px;
    width: min(100%, 220px); margin: 0 auto 16px;
  }
  .logo { display: block; width: 100%; height: auto; border-radius: 8px; }
  h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.04; letter-spacing: -2px; font-weight: 750; }
  .role { margin-top: 7px; color: #525862; font-size: clamp(17px, 3vw, 22px); }
  .divider { height: 1px; background: var(--line); margin: 18px 0 13px; }
  .info { text-align: left; }
  .info-row { display: flex; align-items: center; gap: 13px; min-height: 48px; margin: 6px 0; }
  .info-icon {
    flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; background: #f0f1f3; color: #111318;
  }
  .info-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .info-copy { min-width: 0; text-align: left; }
  .label { color: #777d86; font-size: 12px; font-weight: 750; letter-spacing: 1.25px; text-transform: uppercase; margin-bottom: 4px; }
  .value { font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; color: #15171b; }
  a { color: inherit; text-decoration: none; }
  a:hover .value { text-decoration: underline; text-underline-offset: 3px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .button {
    min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 10px 14px; border-radius: 13px; font-weight: 750; font-size: 15px;
    transition: transform .15s ease, opacity .15s ease;
  }
  .button:hover { transform: translateY(-2px); opacity: .9; }
  .button svg { width: 21px; height: 21px; flex: 0 0 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .instagram { background: #111318; color: white; }
  .youtube { background: #ff0000; color: #ffffff; border: 2px solid #111318; box-shadow: inset 0 0 0 1px #111318; }
  .footer { margin-top: 14px; color: #777d86; font-size: 13px; letter-spacing: .4px; }
  .footer strong { color: #16181d; }
  @media (max-width: 560px) {
    body { padding: 12px 8px; }
    .card { padding: 24px 17px 20px; border-radius: 21px; }
    .logo-wrap { padding: 7px; width: min(100%, 175px); margin-bottom: 13px; }
    .divider { margin: 15px 0 10px; }
    .info-row { gap: 10px; min-height: 44px; margin: 4px 0; }
    .info-icon { flex-basis: 38px; width: 38px; height: 38px; }
    .value { font-size: 14px; }
    .buttons { grid-template-columns: 1fr 1fr; gap: 7px; }
    .button { min-height: 44px; padding: 8px 6px; font-size: 13px; gap: 6px; }
  }
  @media print {
    body { background: white; padding: 0; }
    .card { box-shadow: none; width: 100%; border-radius: 0; }
  }
</style>
</head>
